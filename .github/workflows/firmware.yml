# Builds the XiaoC6RF231 image on every push and pull request.
#
# Pushing a tag that starts with "v" (git tag v0.1.0 && git push origin v0.1.0)
# also:
#   - publishes a GitHub Release with firmware.factory.bin (USB, offset 0x0),
#     firmware.bin (OTA) and SHA256SUMS
#   - redeploys the web flasher on GitHub Pages with that same image
#
# Running the workflow by hand (Actions tab > Firmware > Run workflow) also
# redeploys the flasher, with whatever is on the branch you pick.
#
# One-time repo setup for the flasher, both under Settings:
#   - Pages > Build and deployment > Source: "GitHub Actions"
#   - Environments > github-pages > Deployment branches and tags: add a tag
#     rule "v*". The default rule allows only main, so a tag deploy is refused
#     until it is added.

name: Firmware

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PIO_ENV: XiaoC6RF231

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The toolchain, framework and ESP-IDF Python env are about 1 GB and take
      # a few minutes to download. The key follows platformio.ini, which is
      # where the platform and library versions are pinned.
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install "platformio==6.2.0"

      - name: Build
        run: pio run -e "$PIO_ENV"

      - name: Collect images
        run: |
          mkdir -p out
          cp ".pio/build/$PIO_ENV/firmware.factory.bin" ".pio/build/$PIO_ENV/firmware.bin" out/
          (cd out && sha256sum *.bin > SHA256SUMS && cat SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: out/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: out

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag

  pages:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: out

      # The image is served from the Pages site itself, not linked from the
      # release: the browser fetches it with JavaScript, and release downloads
      # do not send the CORS headers that would allow that.
      - name: Assemble site
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="${GITHUB_REF_NAME}-${GITHUB_SHA::7}"
          fi
          mkdir -p _site
          cp -r flasher/. _site/
          cp out/firmware.factory.bin _site/
          python3 scripts/flasher_manifest.py "$version" > _site/manifest.json
          cat _site/manifest.json

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
