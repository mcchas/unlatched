; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Show computed configuration: CTRL+SHIFT+P > PlatformIO: New Terminal
; > pio project config

[platformio]
; The only board this firmware supports. The Heltec and LilyGo environments
; that used to live here were for the 868 MHz SX1276 boards, whose driver has
; been deleted -- leaving them as the default meant a bare `pio run` on a fresh
; clone would fail on a missing radio.
default_envs = XiaoC6RF231
name = iownhcESP32
description = io-homecontrol for the ESP32


[common]
framework = arduino
board_build.filesystem = littlefs
lib_deps_builtin =
lib_deps_external =
build_flags =
    -DCONFIG_SPI_MASTER_ISR_IN_IRAM=y
    -DCONFIG_SPI_SLAVE_ISR_IN_IRAM=y
    -DCONFIG_UART_ISR_IN_IRAM=y ; Necessary with littleFS ?!
;   -DCONFIG_ESP_BT_ENABLED=no
	-DCONFIG_ESP_WIFI_TASK_PINNED_TO_CORE_1=y
	-DCONFIG_ESP_TIMER_SUPPORTS_ISR_DISPATCH_METHOD=y ; Can set callback in IRAM
;	-DCONFIG_ESP_TIMER_TASK_AFFINITY_CPU0=y ; Let the scheduler decide to balance CPU load
    -DCONFIG_HEAP_CORRUPTION_DETECTION_COMPREHENSIVE
    -DCONFIG_HEAP_POISONING
    -DMALLOC_CAPS
	-Wno-attributes
;	-DCONFIG_FREERTOS_GENERATE_RUN_TIME_STATS=y
;   -DCONFIG_LWIP_MULTICAST_PING=y
    -DCONFIG_LIBC_OPTIMIZED_MISALIGNED_ACCESS
    -DLFS_THREADSAFE ; Avoid erasing in case of crash (concurrencies)
	-I include

extra_scripts =

; Global data for all [env:***]
[env]
framework = ${common.framework}
platform = espressif32@6.12.0
board_build.filesystem = ${common.board_build.filesystem}

; --- MONITOR/DEBUG SETTINGS ---
check_tool = cppcheck, clangtidy
check_skip_packages = yes
;prefer to check build without automatic upload
;targets = upload, monitor

lib_ldf_mode = deep
lib_deps =
	${common.lib_deps_builtin}
 	esphome/ESPAsyncWebServer-esphome @ ^3.4.0
    tzapu/WiFiManager @ ^2.0.17

upload_protocol = esptool
upload_speed = 921600
monitor_speed = 115200
monitor_echo = true
monitor_filters = esp32_exception_decoder, send_on_enter, time, colorize

; Custom debug group can be use in [env:***] via ${debug.***}
[env:debug]
build_type = debug
; Set optimization level and amount of debug info generated by the compiler
debug_build_flags = -O0 -ggdb3 -g3

[extra]
build_flags =
;	!python git_rev_macro.py
;	-DWM_MDNS
	-std=gnu++2a 			;gnu++17; required to set >gnu++17 (or higher), for map lib to use "insert_or_assign()"
	-O3

; ---------------------------------------------------------------------------
; Seeed XIAO ESP32-C6 + AT86RF231 -- io-homecontrol over 2.4 GHz O-QPSK.
;
; Same link layer and crypto as the 868 MHz envs above; only board_config.h and
; the Radio:: driver differ (src/helpers/rf231_helpers.cpp, selected by
; RADIO_AT86RF231). The SX1276 driver it used to sit alongside has been deleted.
;
; The ESP32-C6 needs arduino-esp32 3.x, which the official espressif32 platform
; does not ship -- hence the pioarduino fork. NOTE: a platform reinstall can
; restore pioarduino's broken empty tool-scons and break the build with
; "ModuleNotFoundError: SCons.Tool.FortranCommon"; the fix is in
; ~/.platformio/platforms/espressif32/platform.json (tool-scons -> owner
; "platformio", version "~4.41101.0").
; ---------------------------------------------------------------------------
; Same firmware, flashed over the air instead of over USB. Use this once the rig
; is out of reach of a cable:  pio run -e XiaoC6RF231_ota -t upload
; mDNS is deliberately disabled (net_console.cpp), so address the rig by IP --
; `net` on the console prints it.
[env:XiaoC6RF231_ota]
extends = env:XiaoC6RF231
upload_protocol = espota
; An IP, not velux-rig.local: mDNS does not cross subnets, and the rig lands on
; a different one from the workstation here. `net` on the console prints it --
; set a DHCP reservation if you get tired of updating this line.
upload_port = 10.32.67.182
; Ports matter on this network. OTA requires the DEVICE to open a fresh TCP
; connection back to the host, and an arbitrary high host port is dropped
; crossing subnets -- only the UDP reply gets through, being return traffic a
; stateful firewall already permits. 8266/8267 are open here. The device end is
; set to match in net_console.cpp (ArduinoOTA.setPort).
upload_flags =
    --port=8266
    --host_port=8267
; Known-good equivalent, if the pio wrapper ever misbehaves:
;   python ~/.platformio/packages/framework-arduinoespressif32/tools/espota.py \
;     -r -i <device-ip> -I <host-ip> -p 8266 -P 8267 \
;     -f .pio/build/XiaoC6RF231_ota/firmware.bin

[env:XiaoC6RF231]
platform = espressif32
board = seeed_xiao_esp32c6
; The default 4MB layout gives the app 1.25MB, and WiFi + ArduinoOTA + WiFiManager
; push the image to ~1.7MB. min_spiffs gives two 1.92MB app slots -- two are
; required, because OTA flashes into the inactive one and swaps.
; The 128KB filesystem partition it also reserves is now unused: nothing mounts
; LittleFS any more. Reclaiming it means a different partition table, which is
; a full serial reflash rather than an OTA, so it is left alone.
board_build.partitions = min_spiffs.csv
; The LDF follows #include directives inside #if blocks that are switched off,
; so MQTT/WEBSERVER/SSD1306 would drag in ESPAsyncWebServer, AsyncTCP and
; AsyncMqttClient -- versions that predate arduino-esp32 3.x and no longer
; compile (they want the removed IPv6Address.h). The conditional-aware "+" modes
; are not usable here either: they mis-evaluate the framework's own guards and
; then fail to find Network.h for WiFi. So keep "deep" and simply drop the
; libraries this build has no use for; the features stay off via build flags.
lib_ldf_mode = deep
lib_deps =
	tzapu/WiFiManager @ ^2.0.17
; Only for PARSING, and only in the MQTT bridge: command payloads arrive from a
; broker, which is the one place in this firmware that has to read a document
; somebody else wrote. Everything it EMITS is still built by hand with the
; appenders in include/json_out.h. Header-only with no dependencies of its own,
; so unlike the libraries below it gives the LDF nothing to chase.
;
; The MQTT client itself is NOT a library: it is ESP-IDF's own esp-mqtt, which
; arduino-esp32 ships precompiled. See the header of src/helpers/mqtt_bridge.cpp.
	bblanchon/ArduinoJson @ ^7.2.0
; Vendored under lib/ (library.json name is AsyncMqttClient-esphome) and it
; pulls AsyncTCP, so it has to be ignored explicitly rather than just dropped
; from lib_deps.
lib_ignore =
	AsyncMqttClient-esphome
	AsyncTCP-esphome
	ESPAsyncTCP-esphome
; Two ESP32 USB-JTAG devices show up on this machine, so name the RF231 rig
; rather than let auto-detection pick. Check with `pio device list` if the port
; moves (this one is SER=10:BD:A3:8E:99:08).
upload_port = /dev/cu.usbmodem3124301
monitor_port = /dev/cu.usbmodem3124301
; Regenerates include/web_assets.h from web/ -- the front end, inlined into one
; document and gzipped, compiled into the image rather than put on a filesystem.
; See the script's own header for why. It writes the header only when the
; content changes, so it costs nothing on a rebuild that did not touch web/.
extra_scripts = pre:scripts/gen_web_assets.py
build_unflags =
	-std=gnu++11
	-Os
build_flags =
	-DXIAO_C6_RF231
	${common.build_flags}
	${extra.build_flags}
; Put net_console.cpp's wrapper underneath every character the chip prints.
; The ESP-IDF panic handler writes straight to the UART rather than through the
; esp_rom_printf channel hook it cannot trust, so this is the only way to get a
; crash report off a rig that has no cable within reach. See the comment on
; __wrap_esp_rom_output_tx_one_char.
	-Wl,--wrap=esp_rom_output_tx_one_char
